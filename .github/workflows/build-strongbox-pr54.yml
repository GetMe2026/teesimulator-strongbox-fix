
    
  
name: TEESimulator-RS v307 - StrongBox PR54 (NO INSTALL)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build and audit (no phone access)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      BASE_SHA: 6d241e56d6e8146cd67ed4ac3dadc9c632969549
      PATCH_SHA: fc257bad1753f4258f23a42b85574d972c41b473
      BASELINE_SHA256: ea4cfad7312834b4843e1fe2d7107e4d587e8c988eca558e0656985043928051
      ORIGINAL_DEX_SHA256: a90f5e0a333e6e3cadf8231ffe114b858c4c594dc4f9041ea5e55e115f872364
      ZIP_NAME: TEESimulator-RS-v6.0.1-307-Release.zip

    steps:
      - name: Prepare Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's Ubuntu 24.04 image already supplies command-line SDK tools.
      # Do not use android-actions/setup-android@v3: it invokes the obsolete SDK
      # package "tools" and causes "Failed to find package 'tools'".
      - name: Locate preinstalled Android SDK tools (no legacy tools package)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root/cmdline-tools" || { echo 'Android SDK command-line tools not found on runner'; exit 1; }
          manager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$manager" && test -x "$manager" || { echo 'sdkmanager executable not found on runner'; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$manager")" >> "$GITHUB_PATH"
          "$manager" --version
          # Avoid SIGPIPE from `yes` being mistaken for a license failure.
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk_root" --licenses > /tmp/android-sdk-licenses.log 2>&1
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$license_status" -eq 0 || { tail -n 60 /tmp/android-sdk-licenses.log; exit "$license_status"; }

      - name: Install exact SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.3.13750724' \
            'cmake;3.22.1' \
            'platform-tools'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Prepare Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Fetch and authenticate official v307 release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/Enginex0/TEESimulator-RS/releases/download/v6.0.1-307/$ZIP_NAME" \
            --output "$ZIP_NAME"
          echo "$BASELINE_SHA256  $ZIP_NAME" | sha256sum --check --status
          python3 - <<'PY'
          import os, zipfile
          filename = os.environ['ZIP_NAME']
          with zipfile.ZipFile(filename) as z:
              assert z.testzip() is None, 'Original ZIP CRC failure'
              props = z.read('module.prop').decode()
              assert 'id=tricky_store\n' in props
              assert 'version=v6.0.1-307\n' in props
              assert 'versionCode=307\n' in props
              for name in ('classes.dex', 'customize.sh', 'uninstall.sh', 'target.txt', 'keybox.xml', 'lib/arm64-v8a/libTEESimulator.so'):
                  assert name in z.namelist(), name
          print('PASS: signed-off official release ZIP identity and structure')

