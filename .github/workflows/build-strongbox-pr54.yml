      - name: Compile and package source using upstream Gradle tasks
        shell: bash
        working-directory: tee-source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          java -version
          cargo --version
          ./gradlew zipRelease --no-daemon --stacktrace
          test "$(find out -maxdepth 1 -type f -name '*Release.zip' | wc -l)" -eq 1

      - name: Repack only patched DEX, preserving v307 native binaries and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, os, pathlib, struct, zipfile, zlib
          p = pathlib.Path
          official = p(os.environ['ZIP_NAME'])
          built = list(p('tee-source/out').glob('*Release.zip'))
          assert len(built) == 1, f'Expected one Gradle ZIP, found: {built}'
          original_sha = os.environ['ORIGINAL_DEX_SHA256']
          with zipfile.ZipFile(built[0]) as b:
              assert b.testzip() is None, 'Compiled ZIP has CRC errors'
              dex_files = [n for n in b.namelist() if n.endswith('.dex')]
              assert dex_files == ['classes.dex'], f'Unsupported multi-DEX build: {dex_files}'
              dex = b.read('classes.dex')
          assert dex[:4] == b'dex\n' and dex[7:8] == b'\x00' and len(dex) > 100_000, 'Invalid DEX header/length'
          assert struct.unpack('<I', dex[32:36])[0] == len(dex), 'Invalid DEX file size'
          assert struct.unpack('<I', dex[8:12])[0] == zlib.adler32(dex[12:]) & 0xffffffff, 'Invalid DEX Adler32'
          assert dex[12:32] == hashlib.sha1(dex[32:]).digest(), 'Invalid DEX SHA1 signature'
          assert hashlib.sha256(dex).hexdigest() != original_sha, 'DEX unchanged; refusing candidate'
          output = p('dist/UNVERIFIED_TEESimulator-RS_v307_SB54_CI.zip')
          with zipfile.ZipFile(official) as baseline:
              assert hashlib.sha256(baseline.read('classes.dex')).hexdigest() == original_sha
              props = baseline.read('module.prop').decode()
              assert props.count('version=v6.0.1-307\n') == 1
              props = props.replace('version=v6.0.1-307\n','version=v6.0.1-307-SB54-CI-UNVERIFIED\n')
              # Avoid advertising an unofficial update endpoint; leave versionCode at 307.
              props = '\n'.join(x for x in props.splitlines() if not x.startswith('updateJson=')) + '\n'
              with zipfile.ZipFile(output, 'w') as candidate:
                  for info in baseline.infolist():
                      data = dex if info.filename == 'classes.dex' else (props.encode() if info.filename == 'module.prop' else baseline.read(info.filename))
                      candidate.writestr(info, data)
          with zipfile.ZipFile(official) as baseline, zipfile.ZipFile(output) as candidate:
              assert candidate.testzip() is None
              assert baseline.namelist() == candidate.namelist(), 'File inventory differs'
              differences = {name for name in baseline.namelist() if baseline.read(name) != candidate.read(name)}
              assert differences == {'classes.dex','module.prop'}, f'Other files changed: {differences}'
              assert 'updateJson=' not in candidate.read('module.prop').decode()
              for name in baseline.namelist():
                  if name.startswith('lib/') and not name.endswith('/'):
                      assert baseline.read(name) == candidate.read(name), name
          digest = lambda filename: hashlib.sha256(p(filename).read_bytes()).hexdigest()
          p('dist/SHA256SUMS.txt').write_text(f'{digest(official)}  {official.name}\n{digest(output)}  {output.name}\n')
          p('dist/BUILD_STATUS.txt').write_text(
              'STATUS: COMPILED AND STATICALLY CHECKED; DEVICE UNVERIFIED\n'
              'Base: TEESimulator-RS v6.0.1-307 / 6d241e56d6e8146cd67ed4ac3dadc9c632969549\n'
              'Patch: PR #54 / fc257bad1753f4258f23a42b85574d972c41b473\n'
              'Changes in output ZIP: classes.dex, module.prop only.\n'
              'This ZIP has NOT been tested for Wallet, Strong Integrity, app login, or biometric key accessibility.\n'
              'DO NOT INSTALL until independently reviewed and a recovery plan exists.\n'
              'Original uninstall.sh is retained and may delete persistent_keys if uninstalled.\n'
          )
          print('PASS: native libraries, original scripts and packaged config files unchanged')
          print('OUTPUT:', output)
          PY
          cp StrongBox_PR54_source.diff dist/StrongBox_PR54_source.diff

